{% extends "base.html" %}

{% block title %}
Edit Trek
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-success text-white">

        <h4 class="mb-0">

            Edit Trek

        </h4>

    </div>

    <div class="card-body">

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">Trek Name</label>

                    <input type="text" name="trek_name" value="{{ trek.trek_name }}" class="form-control" required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">Location</label>

                    <input type="text" name="location" value="{{ trek.location }}" class="form-control" required>

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">Difficulty</label>

                    <select name="difficulty" class="form-select">

                        <option value="Easy" {% if trek.difficulty=="Easy" %}selected{% endif %}>Easy</option>

                        <option value="Moderate" {% if trek.difficulty=="Moderate" %}selected{% endif %}>Moderate
                        </option>

                        <option value="Hard" {% if trek.difficulty=="Hard" %}selected{% endif %}>Hard</option>

                    </select>

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">Duration</label>

                    <input type="number" name="duration" value="{{ trek.duration }}" class="form-control" required>

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">Slots</label>

                    <input type="number" name="available_slots" value="{{ trek.available_slots }}" class="form-control"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">Status</label>

                    <select name="status" class="form-select">

                        <option value="Pending" {% if trek.status=="Pending" %}selected{% endif %}>Pending</option>

                        <option value="Approved" {% if trek.status=="Approved" %}selected{% endif %}>Approved</option>

                        <option value="Open" {% if trek.status=="Open" %}selected{% endif %}>Open</option>

                        <option value="Closed" {% if trek.status=="Closed" %}selected{% endif %}>Closed</option>

                        <option value="Completed" {% if trek.status=="Completed" %}selected{% endif %}>Completed
                        </option>

                    </select>

                </div>

                <div class="col-12 mb-3">

                    <label class="form-label">Description</label>

                    <textarea name="description" rows="4" class="form-control">{{ trek.description }}</textarea>

                </div>

            </div>

            <button class="btn btn-success">

                Update Trek

            </button>

            <a href="/treks" class="btn btn-secondary">

                Back

            </a>

        </form>

    </div>

</div>

{% endblock %}
