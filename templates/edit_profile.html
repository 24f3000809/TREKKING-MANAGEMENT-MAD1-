<!DOCTYPE html>
<html>

<head>
    <title>Edit Profile</title>
</head>

<body>

    <h1>Edit Profile</h1>

    <form method="POST">

        <label>Name</label>

        <input type="text" name="name" value="{{ user.name }}" required>

        <br><br>

        <label>Phone</label>

        <input type="text" name="phone" value="{{ user.phone }}" required>

        <br><br>

        <button type="submit">
            Update Profile
        </button>

    </form>

    <br>

    <a href="/user">Back</a>

</body>

</html>
