{% extends "base.html" %}

{% block title %}
Admin Dashboard
{% endblock %}

{% block content %}

<h2 class="text-center mb-3">
    Admin Dashboard
</h2>

<p class="text-center text-muted mb-5">
    Welcome, {{ session["user_name"] }}!
</p>

<div class="row g-4">

    <div class="col-md-6 col-lg-3">
        <div class="card shadow text-center">
            <div class="card-body">
                <h5>Total Treks</h5>
                <h2>{{ total_treks }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-6 col-lg-3">
        <div class="card shadow text-center">
            <div class="card-body">
                <h5>Total Users</h5>
                <h2>{{ total_users }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-6 col-lg-3">
        <div class="card shadow text-center">
            <div class="card-body">
                <h5>Total Staff</h5>
                <h2>{{ total_staff }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-6 col-lg-3">
        <div class="card shadow text-center">
            <div class="card-body">
                <h5>Total Bookings</h5>
                <h2>{{ total_bookings }}</h2>
            </div>
        </div>
    </div>

</div>

{% endblock %}
